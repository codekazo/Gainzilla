<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>KAZOMETER</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one-column app shell on a faint instrument grid. A tick-mark ruler under the header nods to the "meter".
   Home = date, huge greeting, two glowing session cards, PR podium (bench / squat / deadlift, medal-lit).
   Workout pages = edit cards on phones, ruled table on desktop, tinted per session. Dark single-look design. */
:root {
  --bg: #07090c;
  --panel: #0e1217;
  --panel-2: #141a21;
  --line: #1d252e;
  --line-2: #2c3743;
  --grid: rgba(127, 214, 245, .045);
  --fg: #eef3f8;
  --muted: #7d8996;
  --accent: #7fd6f5;
  --accent-rgb: 127, 214, 245;
  --accent-2: #9aa6ff;
  --accent-2-rgb: 154, 166, 255;
  --warn: #e3a54d;
  --up: #5fd38d;
  --down: #ff6b6b;
  --gold: #e2bb5c;
  --gold-rgb: 226, 187, 92;
  --silver: #c7d0dc;
  --silver-rgb: 199, 208, 220;
  --bronze: #cf8b57;
  --bronze-rgb: 207, 139, 87;
  --f-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --cols: 1fr 84px 220px 200px 44px;
  color-scheme: dark;
}
:root[data-kz="christmas"] { --bg: #070d09; --panel: #0d1711; --panel-2: #12201a; --line: #1b2d22; --line-2: #2c4636; --grid: rgba(255, 84, 104, .05); --fg: #f7f2ea; --muted: #8e9f94; --accent: #ff5468; --accent-rgb: 255, 84, 104; --accent-2: #52c98a; --accent-2-rgb: 82, 201, 138; }
:root[data-kz="royal"] { --bg: #07050d; --panel: #0f0a1a; --panel-2: #160f26; --line: #241a3d; --line-2: #3b2a63; --grid: rgba(162, 77, 255, .06); --fg: #f2ecfb; --muted: #8e83a8; --accent: #a24dff; --accent-rgb: 162, 77, 255; --accent-2: #d08bff; --accent-2-rgb: 208, 139, 255; }
:root[data-kz="blaze"] { --bg: #000000; --panel: #0a0a0a; --panel-2: #111111; --line: #1c1c1c; --line-2: #2e2e2e; --grid: rgba(255, 122, 0, .05); --fg: #f5f1ec; --muted: #8a8580; --accent: #ff7a00; --accent-rgb: 255, 122, 0; --accent-2: #ff9f1c; --accent-2-rgb: 255, 159, 28; }
:root[data-kz="halloween"] { --bg: #0a0705; --panel: #15100b; --panel-2: #1c150e; --line: #2a2016; --line-2: #43331f; --grid: rgba(255, 123, 28, .05); --fg: #f6ecdf; --muted: #9a8a76; --accent: #ff7b1c; --accent-rgb: 255, 123, 28; --accent-2: #a762ff; --accent-2-rgb: 167, 98, 255; }
:root[data-kz="nebula"] { --bg: #08060f; --panel: #100c1b; --panel-2: #171126; --line: #241a3a; --line-2: #3a2b5a; --grid: rgba(228, 92, 255, .05); --fg: #f3eefb; --muted: #8f84a6; --accent: #e45cff; --accent-rgb: 228, 92, 255; --accent-2: #6f7dff; --accent-2-rgb: 111, 125, 255; }
:root[data-kz="magma"] { --bg: #0b0605; --panel: #150c0a; --panel-2: #1d1210; --line: #2b1914; --line-2: #472a22; --grid: rgba(255, 77, 46, .05); --fg: #f8ede8; --muted: #9a8179; --accent: #ff4d2e; --accent-rgb: 255, 77, 46; --accent-2: #ffb02e; --accent-2-rgb: 255, 176, 46; }
:root[data-kz="abyss"] { --bg: #040b0d; --panel: #091418; --panel-2: #0e1d22; --line: #14292f; --line-2: #21424a; --grid: rgba(31, 227, 198, .05); --fg: #e8f6f6; --muted: #78949a; --accent: #1fe3c6; --accent-rgb: 31, 227, 198; --accent-2: #3b8fff; --accent-2-rgb: 59, 143, 255; }
:root[data-kz="bloodmoon"] { --bg: #0b0508; --panel: #15080e; --panel-2: #1d0c14; --line: #2c1220; --line-2: #4a1d34; --grid: rgba(232, 38, 79, .05); --fg: #f6e9ee; --muted: #9a7d89; --accent: #e8264f; --accent-rgb: 232, 38, 79; --accent-2: #a54bf0; --accent-2-rgb: 165, 75, 240; }
html { background: var(--bg); }
body {
  background:
    radial-gradient(900px 440px at 10% -6%, rgba(var(--accent-rgb), .14), transparent 62%),
    radial-gradient(700px 380px at 100% 0%, rgba(var(--accent-2-rgb), .09), transparent 66%),
    var(--bg);
  color: var(--fg);
  font: 16px/1.45 var(--f-body);
  padding-block: 18px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: linear-gradient(#000, transparent 75%);
  mask-image: linear-gradient(#000, transparent 75%);
}
*, *::before, *::after { box-sizing: border-box; }
.app { position: relative; z-index: 1; max-width: 920px; margin: 0 auto; }
a { color: inherit; }
button { font: inherit; }

/* header + ruler */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 14px; }
.brand { font: 700 22px/1 var(--f-display); letter-spacing: .2em; color: var(--fg); text-decoration: none; padding: 8px 0; }
.brand span { color: var(--accent); text-shadow: 0 0 22px rgba(var(--accent-rgb), .55); }
.status[hidden] { display: none !important; }
.status { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 12px; letter-spacing: .05em; color: var(--muted); background: rgba(14, 18, 23, .7); }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status.ok { color: var(--accent); border-color: rgba(var(--accent-rgb), .4); }
.status.err { color: var(--warn); border-color: var(--warn); }
.ruler {
  position: relative; height: 12px;
  background-image:
    repeating-linear-gradient(90deg, var(--line-2) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 8px);
  background-size: 100% 12px, 100% 6px;
  background-repeat: repeat-x;
  background-position: 0 100%, 0 100%;
  border-bottom: 1px solid var(--line-2);
}
.ruler::after { content: ""; position: absolute; left: 0; bottom: 0; width: 2px; height: 12px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.banner { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--warn); border-radius: 8px; color: var(--warn); background: rgba(227, 165, 77, .08); font-size: 14px; }

a:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* home: date + greeting */
.date { margin-top: 28px; display: flex; align-items: center; gap: 10px; font: 600 13px/1.2 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.date::before { content: ""; width: 22px; height: 2px; background: var(--accent); box-shadow: 0 0 8px var(--accent); flex: none; }
.hello { margin: 12px 0 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .28em; font: 700 clamp(40px, 12vw, 68px)/1.08 var(--f-display); letter-spacing: -.03em; }
.hello input {
  font: inherit; letter-spacing: inherit; color: var(--accent); background: transparent;
  text-shadow: 0 0 30px rgba(var(--accent-rgb), .4);
  border: 0; border-bottom: 2px dashed rgba(var(--accent-rgb), .35); border-radius: 0;
  padding: 0 2px; margin: 0; min-width: 2ch; max-width: 100%;
  -webkit-appearance: none; appearance: none;
}

.ask { margin: 8px 0 0; font-size: 14px; letter-spacing: .04em; color: var(--muted); }

/* session cards */
.sessions { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.session {
  --c-rgb: var(--accent-rgb); --c: var(--accent);
  position: relative; isolation: isolate; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between; gap: 40px;
  min-height: 176px; padding: 16px; text-decoration: none; color: var(--fg);
  background: linear-gradient(160deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line); border-radius: 12px;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.session.alt { --c-rgb: var(--accent-2-rgb); --c: var(--accent-2); }
.session::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(260px 170px at 100% 0%, rgba(var(--c-rgb), .22), transparent 70%); }
.session::after {
  content: attr(data-g); position: absolute; right: 4px; bottom: -22px; z-index: -1;
  font: 700 128px/1 var(--f-display); color: transparent; -webkit-text-stroke: 1px rgba(var(--c-rgb), .26);
}
.session:hover { transform: translateY(-2px); border-color: rgba(var(--c-rgb), .6); box-shadow: 0 10px 34px -14px rgba(var(--c-rgb), .55); }
.session .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.session svg { width: 22px; height: 22px; color: var(--c); flex: none; }
.session .big { font: 700 clamp(28px, 8.4vw, 46px)/1 var(--f-display); letter-spacing: .05em; }
.session .meta { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.session .meta i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }

/* PR podium */
.pr { margin-top: 44px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.sec-head h2 { margin: 0; font: 600 13px/1.2 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--fg); }
.sec-head p { margin: 0; font-size: 13px; color: var(--muted); }
.podium {
  margin: 18px auto 0; max-width: 720px; display: grid; grid-template-columns: 1fr 1.1fr 1fr; gap: 8px; align-items: end;
  border-bottom: 2px solid var(--line-2);
}
.step {
  --m-rgb: var(--gold-rgb); --m: var(--gold);
  position: relative; isolation: isolate; overflow: hidden; min-width: 0;
  padding: 14px 6px 16px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: linear-gradient(180deg, rgba(var(--m-rgb), .15), var(--panel) 58%);
  border: 1px solid var(--line); border-top: 2px solid var(--m); border-bottom: 0;
  border-radius: 10px 10px 0 0;
  box-shadow: 0 -16px 42px -20px rgba(var(--m-rgb), .6);
}
.step.gold { --m-rgb: var(--gold-rgb); --m: var(--gold); min-height: 276px; }
.step.silver { --m-rgb: var(--silver-rgb); --m: var(--silver); min-height: 240px; }
.step.bronze { --m-rgb: var(--bronze-rgb); --m: var(--bronze); min-height: 210px; }
.lift {
  width: 100%; min-width: 0; padding: 2px 0; text-align: center; text-transform: uppercase;
  font: 700 16px/1.2 var(--f-display); letter-spacing: .08em; color: var(--m);
  background: transparent; border: 0; border-bottom: 1px dashed rgba(var(--m-rgb), .4); border-radius: 0;
  -webkit-appearance: none; appearance: none;
}
.w { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 8px; }
.prw, .prr {
  color: var(--fg); background: transparent; text-align: center;
  border: 0; border-bottom: 1px dashed var(--line-2); border-radius: 0;
  -webkit-appearance: none; appearance: none; min-width: 0;
  font-variant-numeric: tabular-nums;
}
.prw { width: 100%; padding: 2px 0; font: 700 clamp(28px, 7.8vw, 42px)/1.1 var(--f-display); text-shadow: 0 0 24px rgba(var(--m-rgb), .4); }
.u { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.r { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin-top: 8px; color: var(--muted); font-size: 15px; }
.prr { width: 3.2ch; padding: 2px 0; font: 600 20px/1.1 var(--f-display); }

/* body stats, settings link, themes, bodyweight ratio */
.bwx { margin-top: 8px; font: 700 12px/1.2 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--m); font-variant-numeric: tabular-nums; }
.bwx.empty { font: 500 11px/1.2 var(--f-body); letter-spacing: .04em; text-transform: none; color: var(--muted); }
.bodystats { margin-top: 40px; }
.body-grid { margin: 14px auto 0; max-width: 720px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bfield { min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; background: linear-gradient(160deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 10px; }
.bl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.bin { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.bin input { width: 5ch; min-width: 0; padding: 2px 0; text-align: center; color: var(--fg); font: 700 22px/1.1 var(--f-display); font-variant-numeric: tabular-nums; background: transparent; border: 0; border-bottom: 1px dashed var(--line-2); border-radius: 0; -webkit-appearance: none; appearance: none; }
.bin input.sm { width: 2.8ch; }
.bin em { font-style: normal; font-size: 13px; color: var(--muted); margin-right: 4px; }
.settings-link { margin: 40px auto 0; max-width: 720px; min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; text-decoration: none; color: var(--fg); background: linear-gradient(160deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 10px; }
.settings-link:hover { border-color: rgba(var(--accent-rgb), .6); background: var(--panel-2); }
.sl-main { display: flex; flex-direction: column; gap: 2px; }
.sl-title { font: 700 17px/1.2 var(--f-display); letter-spacing: .06em; }
.sl-sub { font-size: 13px; color: var(--muted); }
.settings-link svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
.sec-gap { margin-top: 22px; }
.themes { margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.theme { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 98px; padding: 12px; text-align: left; color: #f2f2f2; background: var(--tb); border: 1px solid rgba(255, 255, 255, .12); border-radius: 10px; cursor: pointer; }
.theme .tprev { display: flex; gap: 6px; margin-bottom: 8px; }
.theme .tprev i { display: block; width: 24px; height: 8px; border-radius: 4px; }
.theme .tprev .a { background: var(--t1); box-shadow: 0 0 10px var(--t1); }
.theme .tprev .b { background: var(--t2); }
.tname { font: 700 15px/1.2 var(--f-display); letter-spacing: .04em; }
.tnote { font-size: 12px; color: rgba(255, 255, 255, .62); }
.theme[aria-pressed="true"] { border-color: var(--t1); box-shadow: 0 0 0 1px var(--t1), 0 10px 28px -14px var(--t1); }
.theme[aria-pressed="true"]::after { content: "Active"; position: absolute; top: 12px; right: 12px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--t1); }
@media (min-width: 760px) { .themes { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* goals */
.goals { margin-top: 40px; }
.goal-list { margin: 14px auto 0; max-width: 720px; display: grid; gap: 10px; }
.goal {
  --m-rgb: var(--gold-rgb); --m: var(--gold);
  display: grid; gap: 8px; padding: 12px 14px;
  background: linear-gradient(160deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 10px;
}
.goal.gold { --m-rgb: var(--gold-rgb); --m: var(--gold); }
.goal.silver { --m-rgb: var(--silver-rgb); --m: var(--silver); }
.goal.bronze { --m-rgb: var(--bronze-rgb); --m: var(--bronze); }
.g-top, .g-bot { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.gname { font: 700 13px/1.2 var(--f-display); letter-spacing: .16em; text-transform: uppercase; color: var(--m); }
.gtogo { font: 700 clamp(18px, 5vw, 22px)/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.goal.done .gtogo { color: var(--up); }
.gbar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.gbar i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--m); box-shadow: 0 0 12px rgba(var(--m-rgb), .6); transition: width .25s ease; }
.gnow, .ggoal { font-size: 13px; color: var(--muted); }
.ggoal { display: inline-flex; align-items: baseline; gap: 6px; }
.goalin {
  width: 5.2ch; min-width: 0; padding: 2px 0; text-align: center; color: var(--fg);
  font: 600 16px/1.1 var(--f-display); font-variant-numeric: tabular-nums;
  background: transparent; border: 0; border-bottom: 1px dashed var(--line-2); border-radius: 0;
  -webkit-appearance: none; appearance: none;
}

/* workout pages */
.wk { --c-rgb: var(--accent-rgb); --c: var(--accent); }
.wk.alt { --c-rgb: var(--accent-2-rgb); --c: var(--accent-2); --accent: var(--accent-2); }
.page-head { margin-top: 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.back {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 12px;
  border: 1px solid var(--line-2); border-radius: 8px; text-decoration: none; font-size: 15px; color: var(--fg);
  background: rgba(14, 18, 23, .7);
}
.back:hover { background: var(--panel-2); border-color: rgba(var(--c-rgb), .6); }
.back svg { width: 18px; height: 18px; color: var(--c); }
.ptitle { margin: 0; font: 700 clamp(34px, 10vw, 54px)/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; text-shadow: 0 0 34px rgba(var(--c-rgb), .4); }
.sub { margin: 12px 0 0; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.sub::before { content: ""; width: 22px; height: 2px; background: var(--c); box-shadow: 0 0 8px var(--c); flex: none; }
.rows { margin-top: 18px; display: grid; gap: 10px; }
.thead { display: none; }
.row {
  display: grid; gap: 8px; padding: 10px;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-areas: "name name name sets" "weight weight reps reps" "cue cue cue cue";
  background: linear-gradient(160deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 10px;
}
.row.custom { grid-template-areas: "name name name sets" "weight weight reps reps" "cue cue cue cue" "rm rm rm rm"; border-color: rgba(var(--c-rgb), .3); }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f.name { grid-area: name; }
.f.sets { grid-area: sets; }
.f.weight { grid-area: weight; }
.f.reps { grid-area: reps; }
.f.cue { grid-area: cue; }
.cell.cue { height: 36px; font: italic 400 14px/1 var(--f-body); color: var(--muted); }
.cell.cue:focus { color: var(--fg); font-style: normal; }
.lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.cell {
  width: 100%; min-width: 0; height: 40px; padding: 0 10px;
  font: 500 16px/1 var(--f-body); color: var(--fg);
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px;
  -webkit-appearance: none; appearance: none; font-variant-numeric: tabular-nums;
}
.cell.nm { font: 600 16px/1 var(--f-display); letter-spacing: .01em; }
.cell.ct { text-align: center; padding: 0 4px; }
.cell::placeholder { color: var(--muted); opacity: .7; }
.cell:focus { border-color: rgba(var(--c-rgb), .7); }
.f.name .lbl { display: none; }
.row:focus-within { border-color: rgba(var(--c-rgb), .5); box-shadow: 0 10px 28px -16px rgba(var(--c-rgb), .6); }
.rm {
  grid-area: rm; justify-self: start; min-height: 40px; padding: 0 14px;
  color: var(--muted); background: transparent; border: 1px solid var(--line-2); border-radius: 7px; font-size: 14px; cursor: pointer;
}
.rm .rmx { display: none; font-size: 22px; line-height: 1; }
.rm:hover { color: var(--fg); border-color: var(--muted); }
.rm.armed { color: var(--warn); border-color: var(--warn); }
.add {
  margin-top: 12px; width: 100%; min-height: 54px; display: flex; align-items: center; justify-content: center; gap: 10px;
  font: 600 15px/1 var(--f-body); letter-spacing: .04em; color: var(--fg); cursor: pointer;
  background: transparent; border: 1px dashed rgba(var(--c-rgb), .55); border-radius: 10px;
}
.add svg { width: 18px; height: 18px; color: var(--c); }

.blog:active { transform: scale(.97); }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.cline { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.3s ease forwards; filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), .7)); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.carea { animation: fadein .9s ease .5s both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.chart text { font: 600 9px var(--f-body); fill: var(--muted); }
.cmeta { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.cmeta b { font: 700 14px/1 var(--f-display); color: var(--fg); }
.llist { margin-top: 10px; border-top: 1px solid var(--line); }
.lrow { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; font-variant-numeric: tabular-nums; }
.lrow .lw { font: 700 15px/1 var(--f-display); }
.lrow .lc { min-width: 3.4em; text-align: right; color: var(--muted); font-size: 13px; }
.lx { min-width: 34px; height: 34px; padding: 0 6px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; }
.lx:hover { color: var(--fg); border-color: var(--line-2); }
.lx.armed { color: var(--warn); border-color: var(--warn); font-size: 12px; }
.hgt { display: grid; grid-template-columns: minmax(0, 150px) 1fr; gap: 14px; align-items: center; }
.fig { width: 100%; height: auto; display: block; max-height: 250px; }
.figg { transition: transform .85s cubic-bezier(.3, 1.25, .5, 1), opacity .4s ease; }
.fig .body { fill: url(#figfill); stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), .55)); }
#figMk { transition: transform .85s cubic-bezier(.3, 1.25, .5, 1), opacity .4s ease; }
#figMk line { stroke: var(--accent-2); stroke-width: 1; stroke-dasharray: 3 4; }
#figLbl { font: 700 13px var(--f-display); fill: var(--fg); }
.fig .tick { stroke: var(--line-2); stroke-width: 1; }
.fig .rl { stroke: var(--line-2); stroke-width: 1.5; }
.fig .ft { font: 600 10px var(--f-body); fill: var(--muted); }
.hside { display: grid; gap: 12px; }
.hin-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.hin-row input { width: 2.3ch; min-width: 0; padding: 2px 0; text-align: center; color: var(--accent); font: 700 clamp(36px, 11vw, 52px)/1.05 var(--f-display); font-variant-numeric: tabular-nums; background: transparent; border: 0; border-bottom: 2px dashed rgba(var(--accent-rgb), .35); border-radius: 0; -webkit-appearance: none; appearance: none; text-shadow: 0 0 24px rgba(var(--accent-rgb), .5); }
.hin-row input.inch { width: 2.9ch; }
.hin-row em { font-style: normal; font-size: 14px; color: var(--muted); margin-right: 8px; }
.hcm { font-size: 14px; color: var(--muted); }
.hcm b { color: var(--fg); font-family: var(--f-display); }
.gauge { display: block; width: 100%; max-width: 300px; margin: 0 auto; overflow: visible; }
#bmiNeedle { transform-origin: 110px 110px; transition: transform 1.1s cubic-bezier(.3, 1.5, .4, 1); }
.gtrack { fill: none; stroke-width: 14; }
.bmi-read { margin-top: -6px; text-align: center; }
.bmi-n { font: 700 44px/1 var(--f-display); font-variant-numeric: tabular-nums; text-shadow: 0 0 24px rgba(var(--accent-rgb), .4); }
.bmi-c { margin-top: 4px; font: 700 14px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.bmi-w { margin: 12px 0 0; font-size: 12px; color: var(--muted); text-align: center; }
.lm { padding: 12px 0; border-top: 1px solid var(--line); }
.lm:first-of-type { border-top: 0; padding-top: 0; }
.lm-top, .lm-bot { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.lm-name { font: 700 13px/1.2 var(--f-display); letter-spacing: .16em; text-transform: uppercase; }
.lm-lvl { font: 700 13px/1.2 var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.lm-bar { position: relative; height: 12px; margin: 10px 0 8px; border-radius: 6px; background: var(--line); overflow: hidden; }
.lm-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 6px; transition: width .95s cubic-bezier(.2, .9, .3, 1); }
.lm-bar i { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(0, 0, 0, .6); }
.lm-ratio { font: 700 14px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.lm-next { font-size: 12px; color: var(--muted); }
.lm-total { display: flex; align-items: baseline; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line-2); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.lm-total b { font: 700 22px/1 var(--f-display); color: var(--fg); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.lm-total em { font-style: normal; margin-left: auto; letter-spacing: 0; text-transform: none; font-family: var(--f-display); font-weight: 700; color: var(--accent); }
.tier-flame { --t1: #ff7a45; --t2: #b32d12; --tg: 255, 122, 69; }
.sessions.three { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sessions.three .session .big { font-size: clamp(15px, 4.8vw, 28px); }
.session { position: relative; }
.session .kzfig { position: absolute; right: 12px; bottom: 8px; margin: 0; }
</style>

  function bodyChart() {

#kzx3 .kzb{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--fg);font:inherit;cursor:pointer}#kzx3 .kzb.go{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700}
#kzx3 .kzb[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
#kzx3 ul{list-style:none;margin:10px 0 0;padding:0}#kzx3 li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kzcc{width:72px;min-height:28px;padding:0 6px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--fg);font:inherit;font-size:13px}
</style>
<script>
(function(){'use strict';
var PK='kazometer:pet:v1',QK='kazometer:petq:v1',CG='kazometer:cgoals:v1',CK='kazometer:caf:v1';
var PETS=[['dog','🐶','Dog'],['cat','🐱','Cat'],['otter','🦦','Otter'],['mouse','🐭','Mouse'],['hamster','🐹','Hamster'],['hedgehog','🦔','Hedgehog'],['dragon','🐉','Dragon']];
var QUOTES=['“Everybody wants to be a bodybuilder, but nobody wants to lift no heavy-ass weights.” — Ronnie Coleman','“The mind is the limit. As long as the mind can envision it, the body can achieve it.” — Arnold Schwarzenegger','“The worst thing I can be is the same as everybody else.” — Arnold Schwarzenegger','“Stimulate, don’t annihilate.” — Lee Haney','“The iron never lies to you.” — Henry Rollins','“The resistance that you fight physically in the gym and the resistance that you fight in life can only build a strong character.” — Arnold Schwarzenegger','“I don’t eat for taste, I eat for function.” — Jay Cutler','“I never wanted to be normal.” — Tom Platz'];
function ld(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v&&typeof v==='object'?v:d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function qon(){return ld(QK,{on:true}).on!==false}
function fmt(n){return String(Math.round(n*100)/100)}
/* quotes: patch the pet that the pet script places */
var QU='kazometer:quotes:v1',tm;
function QL(){var l=ld(QU,{list:[]}).list;return l&&l.length?l:QUOTES}
function rq(){var q=document.querySelector('#kzpet .kzq'),p=document.getElementById('kzpet');if(!qon()){if(q)q.remove();return}if(!p)return;
if(!q){p.insertAdjacentHTML('afterbegin','<span class="kzq"></span>');q=p.querySelector('.kzq')}
var L=QL(),t=L[Math.floor(Math.random()*L.length)],pe=p.querySelector('.pe'),n=0;clearInterval(tm);q.textContent='';q.classList.remove('off');pe.classList.add('talk');
tm=setInterval(function(){n++;q.textContent=t.slice(0,n);if(n>=t.length){clearInterval(tm);pe.classList.remove('talk')}},28)}
setInterval(rq,14000);
/* settings block */
function cgl(){return ld(CG,{list:[]}).list||[]}
function setHTML(){var p=ld(PK,null),c=ld(CK,{}),h='<div class="sec-head sec-gap"><h2>Caffeine goal</h2></div><div class="kzw"><input type="number" id="kzcg" min="0" step="any" inputmode="decimal" placeholder="mg" value="'+(c.goal||'')+'"><button type="button" class="kzb go" data-g="cafset">Set goal</button><button type="button" class="kzb" data-g="cafclr">Clear</button></div>';
h+='<div class="sec-head sec-gap"><h2>Home pet</h2></div><div class="kzw">';
PETS.forEach(function(x){h+='<button type="button" class="kzb" data-g="pet" data-v="'+x[0]+'" aria-pressed="'+(!!p&&p.a===x[0])+'">'+x[1]+' '+x[2]+'</button>'});
h+='<button type="button" class="kzb" data-g="pet" data-v="none" aria-pressed="'+(!p)+'">No pet</button></div><div class="kzw"><button type="button" class="kzb" data-g="quote" aria-pressed="'+qon()+'">Motivational quotes: '+(qon()?'On':'Off')+'</button></div>';
if(p)h+='<div class="kzw"><input type="text" id="kzpn" maxlength="16" placeholder="Pet name" aria-label="Pet name" style="width:160px" value="'+esc(p.n||'')+'"><button type="button" class="kzb go" data-g="pname">Save name</button><button type="button" class="kzb" data-g="pnclr">Default</button></div>';
h+='<div class="sec-head sec-gap"><h2>Pet quotes</h2></div><textarea id="kzqt" rows="5" maxlength="2000" style="width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--fg);font:inherit;font-size:14px">'+esc(QL().join('\n'))+'</textarea><div class="kzw"><button type="button" class="kzb go" data-g="qsave">Save quotes</button><button type="button" class="kzb" data-g="qreset">Reset to default</button></div><p class="note">One quote per line.</p><div class="sec-head sec-gap"><h2>Custom goals</h2></div><div class="kzw"><input type="text" id="kzgn" maxlength="24" placeholder="Goal name"><input type="number" id="kzgc" step="any" placeholder="Now"><input type="number" id="kzgt" step="any" placeholder="Target"><input type="text" id="kzgu" maxlength="6" placeholder="Unit" value="lbs"><button type="button" class="kzb go" data-g="gadd">Add</button></div><ul>';
cgl().forEach(function(g){h+='<li><span>'+esc(g.n)+': '+fmt(g.c)+' / '+fmt(g.t)+' '+esc(g.u)+'</span><button type="button" class="kzb" data-g="gdel" data-v="'+g.id+'">Remove</button></li>'});
return h+'</ul><p class="note">Custom goals show in the Goals section on Home. The podium stays as it is.</p>'}
function mount(){var s=document.querySelector('#app .settings');if(!s)return;var x=document.getElementById('kzx3');if(!x){x=document.createElement('div');x.id='kzx3';x.innerHTML=setHTML();var m=document.getElementById('kzmade');m?s.insertBefore(x,m):s.appendChild(x)}}
/* custom goals on home */
function rows(){var gl=document.querySelector('#app .goal-list');if(!gl)return;var o=document.getElementById('kzcgr');if(o)o.remove();var L=cgl();if(!L.length)return;
var h='<div id="kzcgr" style="display:contents">';L.forEach(function(g){var l=g.t-g.c,pc=g.t>0?Math.max(0,Math.min(100,g.c/g.t*100)):0;
h+='<div class="goal kzcgr'+(l<=0?' done':'')+'"><div class="g-top"><span class="gname">'+esc(g.n)+'</span><span class="gtogo">'+(l>0?fmt(l)+' '+esc(g.u)+' to go':'Goal hit')+'</span></div><div class="gbar" aria-hidden="true"><i style="width:'+pc+'%"></i></div><div class="g-bot"><span class="gnow"><input class="kzcc" type="number" step="any" data-id="'+g.id+'" value="'+g.c+'" aria-label="'+esc(g.n)+' current"> '+esc(g.u)+' now</span><span class="ggoal">Goal '+fmt(g.t)+' '+esc(g.u)+'</span></div></div>'});
gl.insertAdjacentHTML('beforeend',h+'</div>')}
document.addEventListener('change',function(e){var t=e.target;if(!t.classList||!t.classList.contains('kzcc'))return;var d=ld(CG,{list:[]}),g=d.list.filter(function(x){return x.id===t.dataset.id})[0],v=parseFloat(t.value);if(g&&isFinite(v)){g.c=v;sv(CG,d)}rows()});
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('#kzx3 [data-g]');if(!b)return;var a=b.dataset.g,v=b.dataset.v,c=ld(CK,{log:[]}),d=ld(CG,{list:[]});if(!Array.isArray(c.log))c.log=[];
if(a==='cafset'){var n=parseFloat(document.getElementById('kzcg').value);if(n>0&&n<=1e5){c.goal=n;sv(CK,c)}}
else if(a==='cafclr'){delete c.goal;sv(CK,c)}
else if(a==='pname'){var cp=ld(PK,null);if(cp){var nv=document.getElementById('kzpn').value.trim().slice(0,16);if(nv)cp.n=nv;else delete cp.n;sv(PK,cp)}var o=document.getElementById('kzpet');if(o)o.remove();window.dispatchEvent(new Event('hashchange'))}
else if(a==='pnclr'){var cp=ld(PK,null);if(cp){delete cp.n;sv(PK,cp)}var o=document.getElementById('kzpet');if(o)o.remove();window.dispatchEvent(new Event('hashchange'))}
else if(a==='pet'){if(v==='none')localStorage.removeItem(PK);else{var op=ld(PK,null),np={a:v};if(op&&op.n)np.n=op.n;sv(PK,np)}var o=document.getElementById('kzpet');if(o)o.remove();window.dispatchEvent(new Event('hashchange'))}
else if(a==='quote'){sv(QK,{on:!qon()})}
else if(a==='qsave'){var ls=document.getElementById('kzqt').value.split('\n').map(function(x){return x.trim().slice(0,200)}).filter(Boolean).slice(0,30);sv(QU,{list:ls})}
else if(a==='qreset'){localStorage.removeItem(QU)}
else if(a==='gadd'){var nm=document.getElementById('kzgn').value.trim(),cu=parseFloat(document.getElementById('kzgc').value),tg=parseFloat(document.getElementById('kzgt').value),u=document.getElementById('kzgu').value.trim()||'lbs';
if(nm&&tg>0){d.list.push({id:Date.now()+'',n:nm.slice(0,24),c:isFinite(cu)?cu:0,t:tg,u:u.slice(0,6)});sv(CG,d)}}
else if(a==='gdel'){d.list=d.list.filter(function(x){return x.id!==v});sv(CG,d)}
document.getElementById('kzx3').innerHTML=setHTML();setTimeout(rq,60)});
function all(){mount();rows();var p=document.getElementById('kzpet');if(p&&!p.querySelector('.kzq')&&qon())rq()}
var ap=document.getElementById('app');if(ap)new MutationObserver(function(){setTimeout(all,80)}).observe(ap,{childList:true});window.addEventListener('hashchange',function(){setTimeout(all,100)});setTimeout(all,150);
})();
</script>

<style id="kz7-css">

.lg-hero{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:20px 18px;border:1px solid var(--line-2);border-radius:22px;overflow:hidden;background:radial-gradient(420px 200px at 15% 0%,rgba(var(--accent-rgb),.38),transparent 70%),radial-gradient(360px 200px at 95% 100%,rgba(var(--accent-2-rgb),.3),transparent 70%),linear-gradient(160deg,var(--panel-2),var(--panel))}

.lg-m.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 30px -12px var(--accent)}
.intro .lg-m{animation:lgin .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*60ms)}@keyframes lgin{from{opacity:0;transform:translateY(20px) scale(.96)}}

.lg-bar{height:4px;margin:6px 0 8px;border-radius:2px;background:var(--line);overflow:hidden}.lg-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s}
.lg-wd,.lg-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.lg-wd span{text-align:center;font-size:9px;color:var(--muted)}.lg-wd{margin-bottom:3px}
.lg-d{aspect-ratio:1;min-width:0;padding:0;border:0;border-radius:6px;background:var(--line);color:var(--muted);font:600 9.5px var(--f-body);cursor:pointer;transition:transform .15s,background .3s}
.lg-d:hover:not(:disabled){transform:scale(1.18)}.lg-d.fut{opacity:.28;cursor:default}

.lg-d.today{outline:2px solid var(--fg);outline-offset:1px;animation:lgtd 1.6s ease-in-out infinite}@keyframes lgtd{50%{outline-color:transparent}}
.lg-dock{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;align-items:center;gap:10px;margin-top:18px;padding:14px;border:1px solid var(--accent);border-radius:18px;background:rgba(10,10,14,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 12px 36px rgba(0,0,0,.6),0 0 24px -6px rgba(var(--accent-rgb),.6)}
.lg-q{flex:1;min-width:0}.lg-q b{display:block;font:700 16px var(--f-display)}.lg-q span{font-size:11px;color:var(--muted)}
.lg-dock button{min-width:64px;min-height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--fg);font:700 16px var(--f-display);cursor:pointer}
.lg-yes[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#000;box-shadow:0 0 18px rgba(var(--accent-rgb),.7)}.lg-no[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

</style>
